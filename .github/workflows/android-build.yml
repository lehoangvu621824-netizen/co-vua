name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure gradlew is executable
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Decode keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app android/app || true
          echo "$KEYSTORE_BASE64" | base64 --decode > app/my-release-key.jks
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks

      - name: Build APK (try release, fallback to debug)
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            echo "gradlew not found in repo root. Attempting to run gradle wrapper in subprojects..."
            if [ -f "./app/gradlew" ]; then
              ./app/gradlew assembleRelease || ./app/gradlew assembleDebug
            elif [ -f "./android/gradlew" ]; then
              ./android/gradlew assembleRelease || ./android/gradlew assembleDebug
            else
              echo "No gradlew wrapper found. The workflow assumes a Gradle Android project with a gradlew script. Exiting.";
              exit 1
            fi
          fi

      - name: Find APK path
        id: find_apk
        run: |
          set -e
          echo "Searching for APK files..."
          RELEASE_APK=$(find . -type f -path "*/build/outputs/apk/*/app-*-release*.apk" | head -n1 || true)
          DEBUG_APK=$(find . -type f -path "*/build/outputs/apk/*/app-*-debug*.apk" | head -n1 || true)
          if [ -n "$RELEASE_APK" ]; then
            echo "Found release APK: $RELEASE_APK"
            echo "APK_PATH=$RELEASE_APK" >> $GITHUB_OUTPUT
          elif [ -n "$DEBUG_APK" ]; then
            echo "Found debug APK: $DEBUG_APK"
            echo "APK_PATH=$DEBUG_APK" >> $GITHUB_OUTPUT
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
