name: Build Cờ Vua APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài Android SDK Platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Giải nén project
        run: |
          unzip -o co-vua-github-ready.zip -d project
          find project -maxdepth 3 -type f | head -50

    
           - name: Build APK 32-bit ARM
      run: |
        ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit | xargs -r dirname)
        echo "Gradle project: $ROOT"
        cd "$ROOT"
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug 
        
          
          
          
            
        
      

      
    
        

      
          
